<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b111e">
<title>🔺 Triangle Art - 디지털 기하학 아트 & 퍼즐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script>window.addEventListener('contextmenu', function(e) { e.preventDefault(); });</script>
<style>
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #060911;
	color: #f1f5f9;
	font-family: 'Outfit', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
	user-select: none;
	-webkit-user-select: none;
}

#canvas {
	display: block;
	width: 100vw;
	height: 100vh;
	margin: 0;
	padding: 0;
	border: 0;
	outline: none;
}

#canvas:focus {
	outline: none;
}

/* Custom Triangle Art Loading Screen */
#loading {
	position: fixed;
	inset: 0;
	z-index: 9999;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	padding: 24px;
	background: radial-gradient(ellipse at 50% 40%, #151d32 0%, #0d1322 48%, #060911 100%);
	transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
}

#loading.done {
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}

.loading-container {
	width: min(520px, 92vw);
	text-align: center;
	display: flex;
	flex-direction: column;
	align-items: center;
}

/* Geometric Animated Triangles Emblem */
.emblem-wrapper {
	position: relative;
	width: 130px;
	height: 130px;
	margin-bottom: 24px;
}

.emblem-svg {
	width: 100%;
	height: 100%;
	filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.45));
}

.tri-outer {
	transform-origin: 100px 105px;
	animation: rotateOuter 16s linear infinite;
}

.tri-middle {
	transform-origin: 100px 105px;
	animation: rotateMiddle 11s linear infinite reverse;
}

.tri-inner {
	transform-origin: 100px 105px;
	animation: pulseInner 3s ease-in-out infinite alternate;
}

@keyframes rotateOuter {
	from { transform: rotate(0deg); }
	to { transform: rotate(360deg); }
}

@keyframes rotateMiddle {
	from { transform: rotate(0deg); }
	to { transform: rotate(360deg); }
}

@keyframes pulseInner {
	0% { transform: scale(0.88); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.6)); }
	100% { transform: scale(1.12); filter: drop-shadow(0 0 24px rgba(245, 158, 11, 0.95)); }
}

.eyebrow {
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 3.5px;
	text-transform: uppercase;
	color: #38bdf8;
	margin-bottom: 8px;
	text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
}

h1.title {
	font-size: clamp(28px, 6vw, 42px);
	font-weight: 800;
	letter-spacing: -0.5px;
	color: #ffffff;
	margin-bottom: 8px;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}

h1.title span.icon {
	color: #f43f5e;
	filter: drop-shadow(0 0 14px rgba(244, 63, 94, 0.8));
	animation: bounceIcon 2s ease-in-out infinite;
}

@keyframes bounceIcon {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-4px); }
}

p.subtitle {
	font-size: 14px;
	color: #94a3b8;
	font-weight: 400;
	margin-bottom: 32px;
	letter-spacing: 0.2px;
}

/* Progress Bar Track */
.progress-card {
	width: 100%;
	background: rgba(15, 23, 42, 0.7);
	border: 1px solid rgba(255, 255, 255, 0.1);
	border-radius: 16px;
	padding: 16px 20px;
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.track {
	position: relative;
	width: 100%;
	height: 10px;
	background: rgba(255, 255, 255, 0.08);
	border-radius: 9999px;
	overflow: hidden;
	border: 1px solid rgba(255, 255, 255, 0.08);
}

progress {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	appearance: none;
	-webkit-appearance: none;
	border: 0;
	border-radius: 9999px;
	overflow: hidden;
	background: transparent;
}

progress::-webkit-progress-bar {
	background: transparent;
}

progress::-webkit-progress-value {
	background: linear-gradient(90deg, #6366f1 0%, #06b6d4 50%, #10b981 100%);
	border-radius: 9999px;
	box-shadow: 0 0 16px rgba(6, 182, 212, 0.8);
	transition: width 0.2s ease;
}

progress::-moz-progress-bar {
	background: linear-gradient(90deg, #6366f1 0%, #06b6d4 50%, #10b981 100%);
	border-radius: 9999px;
	box-shadow: 0 0 16px rgba(6, 182, 212, 0.8);
}

.status-row {
	display: flex;
	justify-content: space-between;
	align-items: center;
	font-size: 12.5px;
	color: #cbd5e1;
	margin-top: 12px;
	font-weight: 500;
}

.status-stage {
	display: flex;
	align-items: center;
	gap: 6px;
	color: #94a3b8;
}

.status-stage::before {
	content: '';
	display: inline-block;
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: #38bdf8;
	box-shadow: 0 0 8px #38bdf8;
	animation: blinkDot 1.4s infinite alternate;
}

@keyframes blinkDot {
	from { opacity: 0.4; }
	to { opacity: 1; }
}

.status-percent {
	font-weight: 700;
	color: #38bdf8;
	font-variant-numeric: tabular-nums;
}

/* Tip Box */
.tip-box {
	margin-top: 24px;
	font-size: 12px;
	color: #64748b;
	line-height: 1.5;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 6px;
	transition: opacity 0.3s ease;
}

#error-msg {
	margin-top: 16px;
	color: #f87171;
	font-size: 13px;
	background: rgba(239, 68, 68, 0.15);
	border: 1px solid rgba(239, 68, 68, 0.3);
	padding: 10px 16px;
	border-radius: 8px;
	white-space: pre-line;
}

#retry-btn {
	margin-top: 16px;
	padding: 10px 24px;
	background: linear-gradient(135deg, #6366f1, #06b6d4);
	color: #ffffff;
	border: none;
	border-radius: 10px;
	font-weight: 600;
	font-size: 13px;
	cursor: pointer;
	box-shadow: 0 4px 16px rgba(6, 182, 212, 0.4);
	transition: transform 0.15s ease, filter 0.15s ease;
}

#retry-btn:hover {
	filter: brightness(1.1);
	transform: translateY(-1px);
}

@media (max-height: 640px) {
	.emblem-wrapper { width: 90px; height: 90px; margin-bottom: 14px; }
	h1.title { font-size: 26px; }
	p.subtitle { margin-bottom: 18px; }
	.tip-box { margin-top: 14px; }
}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">이 브라우저는 웹 캔버스를 지원하지 않습니다.</canvas>

<section id="loading" aria-label="게임 로딩 화면">
	<div class="loading-container">
		<!-- Animated Geometric Triangles Emblem -->
		<div class="emblem-wrapper" aria-hidden="true">
			<svg class="emblem-svg" viewBox="0 0 200 200">
				<!-- Outer Rotating Triangle (Cyan) -->
				<g class="tri-outer">
					<polygon points="100,24 175,154 25,154" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>
					<circle cx="100" cy="24" r="4" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
					<circle cx="175" cy="154" r="4" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
					<circle cx="25" cy="154" r="4" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
				</g>
				<!-- Middle Rotating Triangle (Violet) -->
				<g class="tri-middle">
					<polygon points="100,44 156,142 44,142" fill="rgba(129, 140, 248, 0.14)" stroke="#818cf8" stroke-width="2.2" stroke-linejoin="round"/>
					<circle cx="100" cy="44" r="3.5" fill="#a5b4fc"/>
					<circle cx="156" cy="142" r="3.5" fill="#a5b4fc"/>
					<circle cx="44" cy="142" r="3.5" fill="#a5b4fc"/>
				</g>
				<!-- Core Pulsing Triangle (Gold) -->
				<g class="tri-inner">
					<polygon points="100,68 135,128 65,128" fill="rgba(245, 158, 11, 0.35)" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
					<circle cx="100" cy="68" r="3" fill="#fde68a"/>
					<circle cx="135" cy="128" r="3" fill="#fde68a"/>
					<circle cx="65" cy="128" r="3" fill="#fde68a"/>
				</g>
			</svg>
		</div>

		<!-- Title & Subtitle -->
		<div class="eyebrow">DIGITAL GEOMETRIC ART & PUZZLE</div>
		<h1 class="title"><span class="icon">🔺</span> TRIANGLE ART</h1>
		<p class="subtitle">삼각형으로 그리는 무한한 기하학 예술과 퍼즐</p>

		<!-- Progress Card -->
		<div class="progress-card">
			<div class="track">
				<progress id="progress" max="100" value="0" aria-label="게임 다운로드 진행률"></progress>
			</div>
			<div class="status-row">
				<span class="status-stage" id="stage">기하학 엔진을 초기화하고 있어요...</span>
				<span class="status-percent" id="percent">0%</span>
			</div>
		</div>

		<!-- Tips -->
		<div class="tip-box" id="tip-box">
			<span id="tip-text">💡 팁: 정점의 자석 스냅 효과로 정삼각형들을 빈틈없이 조립할 수 있습니다.</span>
		</div>

		<div id="error-msg" hidden role="alert"></div>
		<button id="retry-btn" hidden onclick="location.reload()">다시 불러오기</button>

		<noscript>
			<p style="margin-top:16px; color:#f87171;">게임을 실행하려면 브라우저에서 JavaScript를 켜주세요.</p>
		</noscript>
	</div>
</section>

<script>
// Ready hook invoked by Godot or engine promise
window.triangleArtReady = function() {
	const overlay = document.getElementById('loading');
	if (!overlay) return;
	overlay.classList.add('done');
	setTimeout(() => overlay.remove(), 500);
};

// Rotating tips
(function() {
	const tips = [
		"💡 팁: 정점의 자석 스냅 효과로 정삼각형들을 빈틈없이 조립할 수 있습니다.",
		"💡 팁: Ctrl + G 키를 누르면 여러 삼각형을 그룹으로 묶어 한 번에 회전할 수 있습니다.",
		"💡 팁: 초록색 회전 핸들을 드래그하면 15도 단위로 경쾌한 사운드와 함께 회전합니다.",
		"💡 팁: 상단 🎮 챌린지 버튼을 눌러 실루엣을 맞추는 퍼즐 챌린지에 도전해보세요!",
		"💡 팁: 💾 저장 버튼으로 내 아트워크를 .triart 파일로 언제든 소장할 수 있습니다."
	];
	let idx = 0;
	const tipText = document.getElementById('tip-text');
	if (tipText) {
		setInterval(() => {
			idx = (idx + 1) % tips.length;
			tipText.style.opacity = '0';
			setTimeout(() => {
				tipText.textContent = tips[idx];
				tipText.style.opacity = '1';
			}, 300);
		}, 3200);
	}
})();
</script>

<script src="index.js"></script>
<script>
(function() {
	const progress = document.getElementById('progress');
	const percent = document.getElementById('percent');
	const stage = document.getElementById('stage');
	const errorMsg = document.getElementById('error-msg');
	const retryBtn = document.getElementById('retry-btn');

	function fail(err) {
		console.error("Engine failure:", err);
		stage.textContent = '게임을 불러오지 못했습니다.';
		errorMsg.textContent = '리소스를 다운로드하는 중 오류가 발생했습니다.\n인터넷 연결을 확인하시고 [다시 불러오기]를 눌러주세요.';
		errorMsg.hidden = false;
		retryBtn.hidden = false;
	}

	if (typeof Engine === 'undefined') {
		fail('Engine script not loaded');
		return;
	}

	const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9519016,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length > 0) {
		fail('필요한 브라우저 기능이 지원되지 않습니다: ' + missing.join(', '));
		return;
	}

	const engine = new Engine(config);

	engine.startGame({
		onProgress: function(current, total) {
			if (total > 0) {
				const value = Math.min(100, Math.floor((current / total) * 100));
				progress.value = value;
				percent.textContent = value + '%';
				if (value < 40) {
					stage.textContent = '기하학 엔진 리소스를 불러오는 중...';
				} else if (value < 85) {
					stage.textContent = '절차적 사운드 및 창의 도안 데이터를 준비 중...';
				} else if (value < 100) {
					stage.textContent = '캔버스 인터페이스 조립 중...';
				} else {
					stage.textContent = '준비 완료! 게임을 시작합니다.';
				}
			} else {
				progress.removeAttribute('value');
				percent.textContent = '';
			}
		}
	}).then(() => {
		// Engine started, trigger smooth fade out
		setTimeout(window.triangleArtReady, 200);
	}).catch(fail);
})();
</script>
</body>
</html>
